server:
  port: 8085

spring:
  config:
    import: optional:file:.env[.properties],optional:file:../.env[.properties]
  application:
    name: notification-service
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
  mongodb:
    uri: mongodb+srv://${MONGO_DB_USER}:${MONGO_DB_PASS}@${MONGO_CLUSTER_HOST}/uber_notification_db?appName=uber

eureka:
  instance:
    prefer-ip-address: true
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

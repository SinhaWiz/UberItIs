server:
  port: 8083

spring:
  config:
    import: optional:file:.env[.properties],optional:file:../.env[.properties]
  application:
    name: driver-service
  mongodb:
    uri: mongodb+srv://${MONGO_DB_USER}:${MONGO_DB_PASS}@${MONGO_CLUSTER_HOST}/uber_driver_db?appName=uber

eureka:
  instance:
    prefer-ip-address: true
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

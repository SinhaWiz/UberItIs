version: '3.8'

services:
  rabbitmq:
    image: rabbitmq:4-management
    container_name: uber_rabbitmq
    ports:
      # AMQP protocol port (used by Spring Boot services)
      - "5672:5672"
      # Management UI port (access via browser at http://localhost:15672)
      - "15672:15672"
    environment:
      # Default credentials (matching ride-service configuration)
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    volumes:
      # Persist data across container restarts
      - rabbitmq_data:/var/lib/rabbitmq

volumes:
  rabbitmq_data:
